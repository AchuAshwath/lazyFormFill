[project]
name = "lazy-form-fill"
version = "0.1.0"
description = "Medical Birth History Extraction System - Automated extraction of birth history data from audio recordings and clinical text"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "AchuAshwath"}
]
license = {text = "MIT"}
keywords = ["medical", "nlp", "speech-to-text", "information-extraction", "healthcare"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "faster-whisper>=1.0.0",
    "spacy>=3.7.0",
    "medspacy>=1.3.1",
    "numpy==1.23.5",
    "word2number>=1.1",
    "ipykernel>=6.29.5",
    "ipython>=8.18.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "jupyter>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
