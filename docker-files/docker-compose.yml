services:
  faster-whisper:
    image: lscr.io/linuxserver/faster-whisper:latest
    container_name: faster-whisper
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - WHISPER_MODEL=small
      - WHISPER_LANG=en
    volumes:
      - .:/app
    working_dir: /app
    ports:
      - 10300:10300
    restart: unless-stopped
    entrypoint: /app/entrypoint.sh

